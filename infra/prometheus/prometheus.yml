global:
  scrape_interval: 15s

# Metrics arrive by push from the OTel Collector through the OTLP receiver
# (--web.enable-otlp-receiver). These resource attributes become labels on every
# series (host.name -> host_name); all others remain on the target_info series.
otlp:
  promote_resource_attributes:
    - service.name
    - service.instance.id
    - deployment.environment
    - host.name
    - host.arch
    - os.type
    - os.version

storage:
  tsdb:
    # Pushed samples from many agents can arrive slightly out of order.
    out_of_order_time_window: 30m

# No scrape targets for agent data. Prometheus only scrapes itself.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
